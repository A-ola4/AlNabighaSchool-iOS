workflows:
  ios-simulator:
    name: AlNabighaSchool iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode Project
        script: xcodegen generate --spec project.yml

      - name: Build iOS Simulator
        script: |
          xcodebuild \
            -project AlNabighaSchool.xcodeproj \
            -scheme AlNabighaSchool \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.app